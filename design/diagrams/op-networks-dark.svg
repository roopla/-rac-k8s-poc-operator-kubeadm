<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 616" role="img" aria-label="Three networks per RAC pod: one public, two private"><defs><marker id="net-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><style>text{font-family:'Source Sans 3','Segoe UI',Roboto,Arial,sans-serif}.d-bg{fill:#141c23}.d-box{fill:#141c23;stroke:#9caab6;stroke-width:1.2}.d-ghost{fill:none;stroke:#9caab6;stroke-width:1.2;stroke-dasharray:5 4}.d-win{fill:#10171d;stroke:#9caab6;stroke-width:1.2}.d-pod{fill:#123239;stroke:#55bcc6;stroke-width:2}.d-band{fill:#18222b;stroke:#2c3843;stroke-width:1}.d-op{fill:#33280f;stroke:#e0a84a;stroke-width:1.6}.d-disk{fill:#1b2442;stroke:#8fa8ee;stroke-width:1.6}.d-net0{fill:#1c262f;stroke:#9caab6;stroke-width:1.6}.d-net1{fill:#123239;stroke:#55bcc6;stroke-width:1.6}.d-net2{fill:#3a1a2c;stroke:#e08ab9;stroke-width:1.6}.d-line{fill:none;stroke:#9caab6;stroke-width:1.3}.d-bus{fill:none;stroke:#9caab6;stroke-width:2.5}.d-n1{fill:none;stroke:#55bcc6;stroke-width:2.5}.d-n2{fill:none;stroke:#e08ab9;stroke-width:2.5}.d-dash{fill:none;stroke:#9caab6;stroke-width:1.3;stroke-dasharray:5 4}.d-grid{fill:none;stroke:#222d37;stroke-width:1}.d-arrowhead{fill:#9caab6}.d-bar{fill:#55bcc6}.d-barwarn{fill:#ff8a80}.d-barop{fill:#e0a84a}.d-num{fill:#55bcc6}.d-numtext{fill:#141c23;font-size:11px;font-weight:700}.d-title{font-weight:700;font-size:16px;fill:#e3e9ee}.d-name{font-size:13px;font-weight:700;fill:#e3e9ee}.d-head{font-size:12px;font-weight:700;fill:#9caab6;letter-spacing:.04em;text-transform:uppercase}.d-text{font-size:11.5px;fill:#e3e9ee}.d-quiet{font-size:11.5px;fill:#9caab6}.d-small{font-size:10.5px;fill:#9caab6}</style><rect class="d-bg" x="0" y="0" width="900" height="616" rx="12"/><text class="d-title" x="24" y="34">Three networks per RAC pod: one public, two private</text><path class="d-bus" d="M24 76H876"/><path class="d-line" d="M140 76V96"/><path class="d-line" d="M430 76V96"/><path class="d-line" d="M730 76V96"/><rect class="d-box" x="40" y="96" width="200" height="120" rx="8"/><rect class="d-box" x="300" y="96" width="260" height="120" rx="8"/><path class="d-line" d="M430 216V256" marker-end="url(#net-a)"/><rect class="d-pod" x="300" y="256" width="260" height="120" rx="8"/><rect class="d-box" x="600" y="96" width="260" height="120" rx="8"/><path class="d-line" d="M730 216V256" marker-end="url(#net-a)"/><rect class="d-pod" x="600" y="256" width="260" height="120" rx="8"/><path class="d-n1" d="M560 318H600"/><path class="d-n2" d="M560 334H600"/><rect class="d-box" x="40" y="256" width="200" height="120" rx="8"/><path class="d-line" d="M240 316H300" marker-end="url(#net-a)"/><rect class="d-net0" x="40" y="412" width="264" height="176" rx="8"/><rect class="d-net1" x="318" y="412" width="264" height="176" rx="8"/><rect class="d-net2" x="596" y="412" width="264" height="176" rx="8"/><text class="d-quiet" x="32" y="68" text-anchor="start">k8s-public 10.0.1.0/24 (VirtualBox NAT Network) · node NIC enp0s3</text><text class="d-name" x="54" y="118">op-controlplane</text><text class="d-text" x="54" y="136">enp0s3 10.0.1.20</text><text class="d-text" x="54" y="152">no private NICs</text><text class="d-text" x="54" y="168">flannel.1 · 10.244.0.0/24</text><text class="d-name" x="314" y="118">op-worker1</text><text class="d-text" x="314" y="136">enp0s3 10.0.1.21 (k8s-public)</text><text class="d-text" x="314" y="152">enp0s8 · no IP · VirtualBox op-priv1</text><text class="d-text" x="314" y="168">enp0s9 · no IP · VirtualBox op-priv2</text><text class="d-text" x="314" y="184">flannel.1 · pod CIDR 10.244.1.0/24</text><text class="d-name" x="314" y="278">Pod racnode1-0</text><text class="d-text" x="314" y="296">eth0 10.244.1.6 · Flannel (public)</text><text class="d-text" x="314" y="312">eth1 10.0.11.x · macvlan on enp0s8</text><text class="d-text" x="314" y="328">eth2 10.0.12.x · macvlan on enp0s9</text><text class="d-quiet" x="314" y="344">private IPs from .140–.150</text><text class="d-name" x="614" y="118">op-worker2</text><text class="d-text" x="614" y="136">enp0s3 10.0.1.22 (k8s-public)</text><text class="d-text" x="614" y="152">enp0s8 · no IP · VirtualBox op-priv1</text><text class="d-text" x="614" y="168">enp0s9 · no IP · VirtualBox op-priv2</text><text class="d-text" x="614" y="184">flannel.1 · pod CIDR 10.244.2.0/24</text><text class="d-name" x="614" y="278">Pod racnode2-0</text><text class="d-text" x="614" y="296">eth0 10.244.2.4 · Flannel (public)</text><text class="d-text" x="614" y="312">eth1 10.0.11.x · macvlan on enp0s8</text><text class="d-text" x="614" y="328">eth2 10.0.12.x · macvlan on enp0s9</text><text class="d-quiet" x="614" y="344">private IPs from .140–.150</text><text class="d-name" x="54" y="278">CoreDNS answers</text><text class="d-text" x="54" y="296">racnodeN-0 → pod IP</text><text class="d-text" x="54" y="312">racnodeN-0-vip → pod IP</text><text class="d-text" x="54" y="328">racnode-scan → both pod IPs</text><text class="d-quiet" x="54" y="344">(headless Services)</text><text class="d-name" x="54" y="434">Public: Flannel pod network</text><text class="d-text" x="54" y="452">10.244.0.0/16, one /24 per node</text><text class="d-text" x="54" y="468">VXLAN between nodes, MTU 1450</text><text class="d-text" x="54" y="484">Grid registers eth0:10.244.0.0 with</text><text class="d-text" x="54" y="500">mask 255.255.0.0, so both pods</text><text class="d-text" x="54" y="516">share one public subnet</text><text class="d-text" x="54" y="532">SCAN and VIP names resolve here</text><text class="d-quiet" x="54" y="548">reached from outside via NodePort</text><text class="d-name" x="332" y="434">Private 1: macvlan-conf1</text><text class="d-text" x="332" y="452">Multus NetworkAttachmentDefinition</text><text class="d-text" x="332" y="468">macvlan, bridge mode, on enp0s8</text><text class="d-text" x="332" y="484">10.0.11.0/24 · host-local IPAM</text><text class="d-text" x="332" y="500">addresses .140–.150</text><text class="d-text" x="332" y="516">VirtualBox internal net op-priv1</text><text class="d-text" x="332" y="532">promiscuous mode: Allow All</text><text class="d-quiet" x="332" y="548">pod interface eth1</text><text class="d-name" x="610" y="434">Private 2: macvlan-conf2</text><text class="d-text" x="610" y="452">the same, on enp0s9</text><text class="d-text" x="610" y="468">10.0.12.0/24 · host-local IPAM</text><text class="d-text" x="610" y="484">addresses .140–.150</text><text class="d-text" x="610" y="500">VirtualBox internal net op-priv2</text><text class="d-text" x="610" y="516"></text><text class="d-text" x="610" y="532">Grid uses both private nets for the</text><text class="d-quiet" x="610" y="548">interconnect (cache fusion, heartbeats)</text></svg>