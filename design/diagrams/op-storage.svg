x="210" y="176" width="100" height="72" rx="8"/><rect class="d-box" x="326" y="176" width="180" height="72" rx="8"/><rect class="d-box" x="522" y="176" width="150" height="72" rx="8"/><rect class="d-disk" x="688" y="176" width="188" height="72" rx="8"/><path class="d-line" d="M194 212H210" marker-end="url(#sto-a)"/><path class="d-line" d="M310 212H326" marker-end="url(#sto-a)"/><path class="d-line" d="M506 212H522" marker-end="url(#sto-a)"/><path class="d-line" d="M672 212H688" marker-end="url(#sto-a)"/><rect class="d-box" x="24" y="266" width="170" height="72" rx="8"/><rect class="d-box" x="210" y="266" width="100" height="72" rx="8"/><rect class="d-box" x="326" y="266" width="180" height="72" rx="8"/><rect class="d-box" x="522" y="266" width="150" height="72" rx="8"/><rect class="d-disk" x="688" y="266" width="188" height="72" rx="8"/><path class="d-line" d="M194 302H210" marker-end="url(#sto-a)"/><path class="d-line" d="M310 302H326" marker-end="url(#sto-a)"/><path class="d-line" d="M506 302H522" marker-end="url(#sto-a)"/><path class="d-line" d="M672 302H688" marker-end="url(#sto-a)"/><rect class="d-box" x="24" y="372" width="276" height="112" rx="8"/><rect class="d-box" x="312" y="372" width="276" height="112" rx="8"/><rect class="d-op" x="600" y="372" width="276" height="112" rx="8"/><text class="d-head" x="24" y="72" text-anchor="start">Windows (D:)</text><text class="d-head" x="210" y="72" text-anchor="start">VirtualBox</text><text class="d-head" x="326" y="72" text-anchor="start">Inside each worker</text><text class="d-head" x="522" y="72" text-anchor="start">Kubernetes</text><text class="d-head" x="688" y="72" text-anchor="start">ASM, in both pods</text><text class="d-name" x="38" y="108">vote1.vdi</text><text class="d-quiet" x="38" y="126">10 GB · fixed · shareable</text><text class="d-name" x="224" y="108">SATA port 5</text><text class="d-quiet" x="224" y="126">both</text><text class="d-quiet" x="224" y="142">workers</text><text class="d-name" x="340" y="108">/dev/disk/by-id/</text><text class="d-text" x="340" y="126">ata-VBOX_HARDDISK_</text><text class="d-text" x="340" y="142">VB67cb0647-80696c8f</text><text class="d-name" x="536" y="108">PV + PVC 10Gi</text><text class="d-quiet" x="536" y="126">block · ReadWriteMany</text><text class="d-quiet" x="536" y="142">same path in the pod</text><text class="d-name" x="702" y="108">+VOTEDG  (type CRSDG)</text><text class="d-quiet" x="702" y="126">OCR · voting file</text><text class="d-quiet" x="702" y="142">ASM spfile and password file</text><text class="d-name" x="38" y="198">asm1.vdi</text><text class="d-quiet" x="38" y="216">50 GB · fixed · shareable</text><text class="d-name" x="224" y="198">SATA port 3</text><text class="d-quiet" x="224" y="216">both</text><text class="d-quiet" x="224" y="232">workers</text><text class="d-name" x="340" y="198">/dev/disk/by-id/</text><text class="d-text" x="340" y="216">ata-VBOX_HARDDISK_</text><text class="d-text" x="340" y="232">VB74717f76-6ef41222</text><text class="d-name" x="536" y="198">PV + PVC 50Gi</text><text class="d-quiet" x="536" y="216">block · ReadWriteMany</text><text class="d-quiet" x="536" y="232">same path in the pod</text><text class="d-name" x="702" y="198">+DATA  (DBDATAFILESDG)</text><text class="d-quiet" x="702" y="216">data files · spfile · control file 1</text><text class="d-quiet" x="702" y="232">redo member 1 of each group</text><text class="d-name" x="38" y="288">asm2.vdi</text><text class="d-quiet" x="38" y="306">50 GB · fixed · shareable</text><text class="d-name" x="224" y="288">SATA port 4</text><text class="d-quiet" x="224" y="306">both</text><text class="d-quiet" x="224" y="322">workers</text><text class="d-name" x="340" y="288">/dev/disk/by-id/</text><text class="d-text" x="340" y="306">ata-VBOX_HARDDISK_</text><text class="d-text" x="340" y="322">VB204551ec-809e56f5</text><text class="d-name" x="536" y="288">PV + PVC 50Gi</text><text class="d-quiet" x="536" y="306">block · ReadWriteMany</text><text class="d-quiet" x="536" y="322">same path in the pod</text><text class="d-name" x="702" y="288">+FRA  (DBRECOVERY)</text><text class="d-quiet" x="702" y="306">archived logs · control file 2</text><text class="d-quiet" x="702" y="322">redo member 2 · limit 23895M</text><text class="d-head" x="24" y="364" text-anchor="start">Not shared: each worker's own disks</text><text class="d-name" x="38" y="394">/scratch  (80 GB VDI per worker)</text><text class="d-text" x="38" y="412">…/rac/cluster01/racnodeN → /u01 in the pod</text><text class="d-quiet" x="38" y="428">Grid home (about 11 GB), DB home, inventory</text><text class="d-text" x="38" y="444">…/software/stage → /mnt/stage/software</text><text class="d-quiet" x="38" y="460">the two 19.32 gold-image zips, 4.8 GB each</text><text class="d-name" x="326" y="394">/var/lib/containers  (100 GB VDI)</text><text class="d-text" x="326" y="412">CRI-O image store</text><text class="d-text" x="326" y="428">localhost/oracle/database-rac:19.3.0-slim</text><text class="d-quiet" x="326" y="444">443 MB, built on each worker</text><text class="d-quiet" x="326" y="460">imagePullPolicy: IfNotPresent</text><text class="d-name" x="614" y="394">How ASM finds the disks</text><text class="d-text" x="614" y="412">asm_diskstring = the three by-id paths</text><text class="d-quiet" x="614" y="428">set from CRS_ASM_DISCOVERY_STRING</text><text class="d-quiet" x="614" y="444">in the RacDatabase envVars;</text><text class="d-quiet" x="614" y="460">without it the setup script guesses</text><text class="d-quiet" x="614" y="476">a pattern that matches only vote1</text><text class="d-quiet" x="24" y="516" text-anchor="start">Disk group redundancy is EXTERNAL everywhere: each disk group has one disk, and VirtualBox is the only copy.</text><text class="d-quiet" x="24" y="536" text-anchor="start">Control file and redo have one copy in DATA and one in FRA, so losing either disk group still leaves one.</text></svg>