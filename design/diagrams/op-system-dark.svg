AT Network 10.0.1.0/24 · NAT port forwards</text><text class="d-name" x="38" y="218">op-controlplane</text><text class="d-text" x="38" y="236">10.0.1.20 · 2 vCPU · 4 GB</text><text class="d-text" x="38" y="252">kube-apiserver · etcd</text><text class="d-text" x="38" y="268">scheduler</text><text class="d-text" x="38" y="284">controller-manager</text><text class="d-text" x="38" y="300">CoreDNS (the RAC host names)</text><text class="d-text" x="38" y="316">kubelet · CRI-O · Flannel</text><text class="d-quiet" x="38" y="332">Kubernetes v1.36.5</text><text class="d-name" x="254" y="218">op-worker1 · 10.0.1.21</text><text class="d-text" x="254" y="236">4 vCPU · 22 GB · 2048 × 2 MB hugepages</text><text class="d-text" x="254" y="252">kubelet · CRI-O · Flannel · Multus</text><text class="d-name" x="270" y="280">Pod racnode1-0  (StatefulSet racnode1)</text><text class="d-text" x="270" y="298">eth0 10.244.1.6 · public network and VIP</text><text class="d-text" x="270" y="314">eth1 10.0.11.x · eth2 10.0.12.x · interconnect</text><text class="d-text" x="270" y="330">Grid 19.32: CRS · CSS · ASM +ASM1</text><text class="d-text" x="270" y="346">SCAN :1521 · node LISTENER :1522, :31522</text><text class="d-text" x="270" y="362">instance ORCLCDB1 · ORCLPDB · orclpdbsvc</text><text class="d-text" x="270" y="378">/u01 ← /scratch/rac/cluster01/racnode1</text><text class="d-quiet" x="270" y="394">16 GiB · 3 CPU · 4 GiB hugepages (Guaranteed)</text><text class="d-name" x="580" y="218">op-worker2 · 10.0.1.22</text><text class="d-text" x="580" y="236">4 vCPU · 22 GB · 2048 × 2 MB hugepages</text><text class="d-text" x="580" y="252">kubelet · CRI-O · Flannel · Multus</text><text class="d-name" x="596" y="280">Pod racnode2-0  (StatefulSet racnode2)</text><text class="d-text" x="596" y="298">eth0 10.244.2.4 · public network and VIP</text><text class="d-text" x="596" y="314">eth1 10.0.11.x · eth2 10.0.12.x · interconnect</text><text class="d-text" x="596" y="330">Grid 19.32: CRS · CSS · ASM +ASM2</text><text class="d-text" x="596" y="346">SCAN :1521 · node LISTENER :1522, :31523</text><text class="d-text" x="596" y="362">instance ORCLCDB2 · ORCLPDB · orclpdbsvc</text><text class="d-text" x="596" y="378">/u01 ← /scratch/rac/cluster01/racnode2</text><text class="d-quiet" x="596" y="394">16 GiB · 3 CPU · 4 GiB hugepages (Guaranteed)</text><text class="d-name" x="270" y="460">Oracle Database Operator</text><text class="d-quiet" x="270" y="478">v2.2.0 · 1 controller replica</text><text class="d-quiet" x="270" y="494">(can run on either worker)</text><text class="d-name" x="254" y="582">Shared ASM disks: the same three disks attached to both workers</text><text class="d-name" x="270" y="615">vote1 · 10 GB → +VOTEDG</text><text class="d-quiet" x="270" y="633">OCR · voting file</text><text class="d-name" x="476" y="615">asm1 · 50 GB → +DATA</text><text class="d-quiet" x="476" y="633">data files · redo · control</text><text class="d-name" x="682" y="615">asm2 · 50 GB → +FRA</text><text class="d-quiet" x="682" y="633">archive logs · redo · control</text><text class="d-name" x="38" y="702">Kubernetes objects</text><text class="d-name" x="54" y="734">Created by you</text><text class="d-text" x="54" y="752">RacDatabase racdb (one YAML file)</text><text class="d-text" x="54" y="768">Secrets ssh-key-secret, db-user-pass</text><text class="d-text" x="54" y="784">NADs macvlan-conf1, macvlan-conf2</text><text class="d-text" x="54" y="800">node label raccluster=raccluster01</text><text class="d-name" x="330" y="734">Created by the operator (namespace rac)</text><text class="d-text" x="330" y="752">StatefulSets racnode1, racnode2</text><text class="d-text" x="330" y="768">3 PVs asm-pv-… + 3 PVCs asm-pvc-…-racdb</text><text class="d-text" x="330" y="784">headless Services: node, VIP and SCAN names</text><text class="d-text" x="330" y="800">NodePort racnode-scan-lsnr 1521 → 31521</text><text class="d-name" x="670" y="734">Other namespaces</text><text class="d-text" x="670" y="752">oracle-database-operator-system</text><text class="d-text" x="670" y="768">cert-manager (webhook TLS)</text><text class="d-text" x="670" y="784">kube-system</text><text class="d-quiet" x="670" y="800">Flannel · Multus · CoreDNS</text></svg>