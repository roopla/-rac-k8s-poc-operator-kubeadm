<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="Patch once on a build host, install many times without patching"><defs><marker id="gld-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><style>text{font-family:'Source Sans 3','Segoe UI',Roboto,Arial,sans-serif}.d-bg{fill:#ffffff}.d-box{fill:#ffffff;stroke:#5b6772;stroke-width:1.2}.d-ghost{fill:none;stroke:#5b6772;stroke-width:1.2;stroke-dasharray:5 4}.d-win{fill:#f6f7f8;stroke:#5b6772;stroke-width:1.2}.d-pod{fill:#e3f1f2;stroke:#0b6e78;stroke-width:2}.d-band{fill:#f1f4f6;stroke:#d5dbe1;stroke-width:1}.d-op{fill:#fbf1df;stroke:#8a5a00;stroke-width:1.6}.d-disk{fill:#e8edf9;stroke:#3b5bb5;stroke-width:1.6}.d-net0{fill:#eef1f3;stroke:#5b6772;stroke-width:1.6}.d-net1{fill:#e3f1f2;stroke:#0b6e78;stroke-width:1.6}.d-net2{fill:#f6e6ef;stroke:#a2457a;stroke-width:1.6}.d-line{fill:none;stroke:#5b6772;stroke-width:1.3}.d-bus{fill:none;stroke:#5b6772;stroke-width:2.5}.d-n1{fill:none;stroke:#0b6e78;stroke-width:2.5}.d-n2{fill:none;stroke:#a2457a;stroke-width:2.5}.d-dash{fill:none;stroke:#5b6772;stroke-width:1.3;stroke-dasharray:5 4}.d-grid{fill:none;stroke:#e6eaee;stroke-width:1}.d-arrowhead{fill:#5b6772}.d-bar{fill:#0b6e78}.d-barwarn{fill:#b3261e}.d-barop{fill:#8a5a00}.d-num{fill:#0b6e78}.d-numtext{fill:#ffffff;font-size:11px;font-weight:700}.d-title{font-weight:700;font-size:16px;fill:#17212b}.d-name{font-size:13px;font-weight:700;fill:#17212b}.d-head{font-size:12px;font-weight:700;fill:#5b6772;letter-spacing:.04em;text-transform:uppercase}.d-text{font-size:11.5px;fill:#17212b}.d-quiet{font-size:11.5px;fill:#5b6772}.d-small{font-size:10.5px;fill:#5b6772}</style><rect class="d-bg" x="0" y="0" width="900" height="540" rx="12"/><text class="d-title" x="24" y="34">Patch once on a build host, install many times without patching</text><rect class="d-band" x="24" y="56" width="852" height="214" rx="8"/><rect class="d-box" x="40" y="92" width="152" height="92" rx="8"/><circle class="d-num" cx="58" cy="110" r="10"/><path class="d-line" d="M192 138H206" marker-end="url(#gld-a)"/><rect class="d-box" x="206" y="92" width="152" height="92" rx="8"/><circle class="d-num" cx="224" cy="110" r="10"/><path class="d-line" d="M358 138H372" marker-end="url(#gld-a)"/><rect class="d-box" x="372" y="92" width="152" height="92" rx="8"/><circle class="d-num" cx="390" cy="110" r="10"/><path class="d-line" d="M524 138H538" marker-end="url(#gld-a)"/><rect class="d-box" x="538" y="92" width="152" height="92" rx="8"/><circle class="d-num" cx="556" cy="110" r="10"/><path class="d-line" d="M690 138H704" marker-end="url(#gld-a)"/><rect class="d-box" x="704" y="92" width="152" height="92" rx="8"/><circle class="d-num" cx="722" cy="110" r="10"/><path class="d-line" d="M154 270V302" marker-end="url(#gld-a)"/><rect class="d-box" x="24" y="302" width="260" height="112" rx="8"/><path class="d-line" d="M284 358H312" marker-end="url(#gld-a)"/><rect class="d-op" x="312" y="302" width="276" height="112" rx="8"/><path class="d-line" d="M588 358H616" marker-end="url(#gld-a)"/><rect class="d-pod" x="616" y="302" width="260" height="112" rx="8"/><path class="d-line" d="M746 414V446" marker-end="url(#gld-a)"/><rect class="d-pod" x="312" y="446" width="564" height="64" rx="8"/><text class="d-name" x="38" y="78">Build host oldblab-db1 · Oracle Linux 9.8 · users grid and oracle · no cluster, no shared disks</text><text class="d-name" x="74" y="114">Unzip 19.3</text><text class="d-text" x="74" y="132">base Grid zip and</text><text class="d-text" x="74" y="148">base DB zip, each</text><text class="d-text" x="74" y="164">into its own home</text><text class="d-numtext" x="58" y="114" text-anchor="middle">1</text><text class="d-name" x="240" y="114">New OPatch</text><text class="d-text" x="240" y="132">rm -rf OPatch</text><text class="d-text" x="240" y="148">unzip p6880880</text><text class="d-text" x="240" y="164">12.2.0.1.17 → .54</text><text class="d-numtext" x="224" y="114" text-anchor="middle">2</text><text class="d-name" x="406" y="114">-applyRU</text><text class="d-text" x="406" y="132">GI RU 39922757</text><text class="d-text" x="406" y="148">in both homes;</text><text class="d-text" x="406" y="164">OJVM, JDK patch</text><text class="d-numtext" x="390" y="114" text-anchor="middle">3</text><text class="d-name" x="572" y="114">Software only</text><text class="d-text" x="572" y="132">software-only</text><text class="d-text" x="572" y="148">installs, then</text><text class="d-text" x="572" y="164">root.sh</text><text class="d-numtext" x="556" y="114" text-anchor="middle">4</text><text class="d-name" x="738" y="114">Gold image</text><text class="d-text" x="738" y="132">-createGoldImage</text><text class="d-text" x="738" y="148">per home · rename</text><text class="d-text" x="738" y="164">unzip -t · sha256</text><text class="d-numtext" x="722" y="114" text-anchor="middle">5</text><text class="d-text" x="40" y="212" text-anchor="start">Result: everything patched and relinked, nothing configured: no cluster, no ASM, no database, no listener.</text><text class="d-quiet" x="40" y="232" text-anchor="start">This build: RU 19.33.0.0.261020 (October 2026) · lspatches: Grid home 7 patches, Oracle home 4</text><text class="d-quiet" x="40" y="252" text-anchor="start">Two zips: oracle-gridhome-19.33.zip · oracle-dbhome-19.33.zip, plus their .sha256 file</text><text class="d-name" x="38" y="324">Stage on both workers</text><text class="d-text" x="38" y="342">/scratch/software/stage</text><text class="d-text" x="38" y="358">755 · container_file_t label</text><text class="d-text" x="38" y="374">sha256sum -c against the</text><text class="d-text" x="38" y="390">build host's checksums</text><text class="d-name" x="326" y="324">The RacDatabase names them</text><text class="d-text" x="326" y="342">hostSwStageLocation</text><text class="d-text" x="326" y="358">gridSwZipFile · dbSwZipFile</text><text class="d-quiet" x="326" y="374">the pod sees the folder as</text><text class="d-quiet" x="326" y="390">/mnt/stage/software</text><text class="d-name" x="630" y="324">Each RAC pod</text><text class="d-text" x="630" y="342">unzips both homes into /u01</text><text class="d-text" x="630" y="358">CRS_SWONLY / INSTALL_DB_SWONLY</text><text class="d-text" x="630" y="374">with -noCopy: register only,</text><text class="d-text" x="630" y="390">no patching, no copying</text><text class="d-name" x="326" y="468">Then the cluster and the database</text><text class="d-text" x="326" y="486">gridSetup config + root.sh · asmca · DBCA, which runs datapatch for the RU already in the home</text></svg>