<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" role="img" aria-label="What one kubectl apply sets in motion"><defs><marker id="ope-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><style>text{font-family:'Source Sans 3','Segoe UI',Roboto,Arial,sans-serif}.d-bg{fill:#ffffff}.d-box{fill:#ffffff;stroke:#5b6772;stroke-width:1.2}.d-ghost{fill:none;stroke:#5b6772;stroke-width:1.2;stroke-dasharray:5 4}.d-win{fill:#f6f7f8;stroke:#5b6772;stroke-width:1.2}.d-pod{fill:#e3f1f2;stroke:#0b6e78;stroke-width:2}.d-band{fill:#f1f4f6;stroke:#d5dbe1;stroke-width:1}.d-op{fill:#fbf1df;stroke:#8a5a00;stroke-width:1.6}.d-disk{fill:#e8edf9;stroke:#3b5bb5;stroke-width:1.6}.d-net0{fill:#eef1f3;stroke:#5b6772;stroke-width:1.6}.d-net1{fill:#e3f1f2;stroke:#0b6e78;stroke-width:1.6}.d-net2{fill:#f6e6ef;stroke:#a2457a;stroke-width:1.6}.d-line{fill:none;stroke:#5b6772;stroke-width:1.3}.d-bus{fill:none;stroke:#5b6772;stroke-width:2.5}.d-n1{fill:none;stroke:#0b6e78;stroke-width:2.5}.d-n2{fill:none;stroke:#a2457a;stroke-width:2.5}.d-dash{fill:none;stroke:#5b6772;stroke-width:1.3;stroke-dasharray:5 4}.d-grid{fill:none;stroke:#e6eaee;stroke-width:1}.d-arrowhead{fill:#5b6772}.d-bar{fill:#0b6e78}.d-barwarn{fill:#b3261e}.d-barop{fill:#8a5a00}.d-num{fill:#0b6e78}.d-numtext{fill:#ffffff;font-size:11px;font-weight:700}.d-title{font-weight:700;font-size:16px;fill:#17212b}.d-name{font-size:13px;font-weight:700;fill:#17212b}.d-head{font-size:12px;font-weight:700;fill:#5b6772;letter-spacing:.04em;text-transform:uppercase}.d-text{font-size:11.5px;fill:#17212b}.d-quiet{font-size:11.5px;fill:#5b6772}.d-small{font-size:10.5px;fill:#5b6772}</style><rect class="d-bg" x="0" y="0" width="900" height="660" rx="12"/><text class="d-title" x="24" y="34">What one kubectl apply sets in motion</text><rect class="d-win" x="24" y="56" width="200" height="84" rx="8"/><path class="d-line" d="M224 98H256" marker-end="url(#ope-a)"/><rect class="d-box" x="256" y="56" width="180" height="84" rx="8"/><path class="d-line" d="M436 98H468" marker-end="url(#ope-a)"/><rect class="d-op" x="468" y="56" width="408" height="84" rx="8"/><path class="d-line" d="M672 140V168" marker-end="url(#ope-a)"/><rect class="d-band" x="24" y="168" width="852" height="248" rx="8"/><rect class="d-box" x="40" y="204" width="152" height="92" rx="8"/><circle class="d-num" cx="58" cy="222" r="10"/><path class="d-line" d="M192 250H206" marker-end="url(#ope-a)"/><rect class="d-box" x="206" y="204" width="152" height="92" rx="8"/><circle class="d-num" cx="224" cy="222" r="10"/><path class="d-line" d="M358 250H372" marker-end="url(#ope-a)"/><rect class="d-box" x="372" y="204" width="152" height="92" rx="8"/><circle class="d-num" cx="390" cy="222" r="10"/><path class="d-line" d="M524 250H538" marker-end="url(#ope-a)"/><rect class="d-box" x="538" y="204" width="152" height="92" rx="8"/><circle class="d-num" cx="556" cy="222" r="10"/><path class="d-line" d="M690 250H704" marker-end="url(#ope-a)"/><rect class="d-box" x="704" y="204" width="152" height="92" rx="8"/><circle class="d-num" cx="722" cy="222" r="10"/><path class="d-line" d="M232 416V452" marker-end="url(#ope-a)"/><path class="d-line" d="M664 416V452" marker-end="url(#ope-a)"/><rect class="d-pod" x="24" y="452" width="420" height="160" rx="8"/><rect class="d-pod" x="456" y="452" width="420" height="160" rx="8"/><path class="d-n1" d="M444 532H456"/><path class="d-dash" d="M876 560H890V258H860" marker-end="url(#ope-a)"/><text class="d-name" x="38" y="78">You</text><text class="d-text" x="38" y="96">kubectl apply -f racdb.yaml</text><text class="d-quiet" x="38" y="112">kind: RacDatabase</text><text class="d-name" x="270" y="78">kube-apiserver</text><text class="d-text" x="270" y="96">stores it in etcd</text><text class="d-quiet" x="270" y="112">asks the webhook first</text><text class="d-name" x="482" y="78">Operator's admission webhook (TLS from cert-manager)</text><text class="d-text" x="482" y="96">pod memory ≥ 16 GiB · hugepages ≥ SGA · SGA + PGA ≤ 80 %</text><text class="d-text" x="482" y="112">disk groups present, types valid and unique · secrets and sysctls set</text><text class="d-name" x="38" y="190">Operator reconcile loop (oracle-database-operator-system)</text><text class="d-name" x="74" y="226">Disk check</text><text class="d-text" x="74" y="244">a DaemonSet pod</text><text class="d-text" x="74" y="260">per worker reads</text><text class="d-text" x="74" y="276">each disk's size</text><text class="d-numtext" x="58" y="226" text-anchor="middle">1</text><text class="d-name" x="240" y="226">Volumes</text><text class="d-text" x="240" y="244">one PV + PVC</text><text class="d-text" x="240" y="260">per disk</text><text class="d-text" x="240" y="276">block · RWX</text><text class="d-numtext" x="224" y="226" text-anchor="middle">2</text><text class="d-name" x="406" y="226">Services</text><text class="d-text" x="406" y="244">headless names</text><text class="d-text" x="406" y="260">node, VIP, SCAN</text><text class="d-text" x="406" y="276">NodePort 31521</text><text class="d-numtext" x="390" y="226" text-anchor="middle">3</text><text class="d-name" x="572" y="226">StatefulSets</text><text class="d-text" x="572" y="244">racnode1, racnode2</text><text class="d-text" x="572" y="260">env from the YAML</text><text class="d-text" x="572" y="276">Secrets mounted</text><text class="d-numtext" x="556" y="226" text-anchor="middle">4</text><text class="d-name" x="738" y="226">Status</text><text class="d-text" x="738" y="244">PENDING →</text><text class="d-text" x="738" y="260">AVAILABLE</text><text class="d-text" x="738" y="276">connect string</text><text class="d-numtext" x="722" y="226" text-anchor="middle">5</text><text class="d-head" x="40" y="324" text-anchor="start">Environment the operator derives for the pods (examples):</text><text class="d-text" x="40" y="344" text-anchor="start">CRS_ASM_DEVICE_LIST, DB_ASM_DEVICE_LIST, RECO_ASM_DEVICE_LIST · CRS_ASM_DISKGROUP=+VOTEDG · DB_DATA_FILE_DEST=+DATA</text><text class="d-text" x="40" y="362" text-anchor="start">DB_RECOVERY_FILE_DEST=+FRA · DB_NAME, ORACLE_PDB, DB_SERVICE · INIT_SGA_SIZE, INIT_PGA_SIZE · OP_TYPE=setuprac</text><text class="d-text" x="40" y="380" text-anchor="start">plus your envVars: LOG_DIR, IGNORE_CRS_PREREQS, IGNORE_DB_PREREQS, CRS_ASM_DISCOVERY_STRING</text><text class="d-text" x="40" y="398" text-anchor="start">Secrets mounted: SSH key pair (/mnt/.ssh) · encrypted password + key (/mnt/.dbsecrets)</text><text class="d-name" x="38" y="474">Pod racnode1-0: the install node</text><text class="d-text" x="38" y="492">systemd starts runOracle.sh → main.py</text><text class="d-text" x="38" y="508">unzips its own Grid and DB homes</text><text class="d-text" x="38" y="524">drives the whole install over SSH:</text><text class="d-quiet" x="38" y="540">Grid on both pods, VOTEDG, DB homes,</text><text class="d-quiet" x="38" y="556">DATA and FRA, DBCA, listeners, service</text><text class="d-text" x="38" y="572">log: /tmp/orod/oracle_db_setup.log</text><text class="d-name" x="470" y="474">Pod racnode2-0</text><text class="d-text" x="470" y="492">systemd starts the same scripts</text><text class="d-text" x="470" y="508">unzips its own Grid and DB homes</text><text class="d-text" x="470" y="524">puts the SSH keys in place, then waits</text><text class="d-quiet" x="470" y="540">racnode1-0 runs gridSetup, runInstaller</text><text class="d-quiet" x="470" y="556">and root.sh here over SSH</text><text class="d-text" x="470" y="572">health probes: main.py --checkracinst / --checkdbrole</text><text class="d-quiet" x="450" y="640" text-anchor="middle">the operator keeps reading pod and database state back into racdb's status</text></svg>